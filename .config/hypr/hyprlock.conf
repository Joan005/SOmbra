general {
    screencopy_mode = 1
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = __HOME__/.config/quickshell/wallpaper.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    color = rgba(230, 237, 243, 1.0)
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%d / %m / %Y"
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = rgba(125, 138, 166, 1.0)
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    rounding = 4
    outline_thickness = 2
    outer_color = rgba(192, 76, 253, 1.0)
    inner_color = rgba(12, 14, 22, 0.94)
    font_color = rgba(230, 237, 243, 1.0)
    font_family = JetBrainsMono Nerd Font
    check_color = rgba(57, 255, 159, 1.0)
    fail_color = rgba(255, 46, 77, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Contraseña</i>
    fail_text = <i>Incorrecta</i>
    dots_center = true
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = rgba(125, 138, 166, 1.0)
    position = 0, -90
    halign = center
    valign = center
}
